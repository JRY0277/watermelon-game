plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mergegame'
    // AGP 9.0 最高只支持到 API 36，所以这里不能用 37
    // 如果 SDK Manager 里没装 android-36 平台，Android Studio 会提示下载
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.mergegame"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
